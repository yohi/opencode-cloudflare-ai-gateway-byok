name: release-please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-slim
    steps:
      - uses: googleapis/release-please-action@c3fc4de07084f75a2b61a5b933069bda6edf3d5c # v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@yohi'

      - name: Install dependencies
        run: bun install
        if: ${{ steps.release.outputs.release_created }}

      - name: Build
        run: bun run build
        if: ${{ steps.release.outputs.release_created }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-ai-gateway-byok-dist
          path: dist/
        if: ${{ steps.release.outputs.release_created }}

      - name: Publish to GitHub Packages
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ steps.release.outputs.release_created }}

      - name: Pack and Upload Release Asset
        run: |
          PACKAGE_FILE=$(npm pack)
          gh release upload ${{ steps.release.outputs.tag_name }} $PACKAGE_FILE
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: ${{ steps.release.outputs.release_created }}
